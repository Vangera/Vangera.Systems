<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="Vangera Systems — home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 9l8 15 8-15" fill="none" stroke="#0b1530" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Vangera <b>Systems</b></span>
    </a>
    <nav id="site-nav" aria-label="Main">
      <ul>
        <li><a href="/#services">Services</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li><a href="/#process">How I work</a></li>
        <li><a href="/#about">About</a></li>
        <li><a class="nav-cta" href="/#contact">Contact</a></li>
      </ul>
    </nav>
    <div class="header-tools">
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">
        <span class="i-moon">{{ partial "icon.html" "moon" }}</span><span class="i-sun">{{ partial "icon.html" "sun" }}</span>
      </button>
      <button class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="i-menu">{{ partial "icon.html" "menu" }}</span><span class="i-close">{{ partial "icon.html" "close" }}</span><span class="menu-label">Menu</span>
      </button>
    </div>
  </div>
</header>
