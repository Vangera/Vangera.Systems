<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- with resources.Get "js/site.js" | minify | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
{{- end }}
{{- $title := cond .IsHome .Title (printf "%s — %s" .Title site.Title) }}
<title>{{ $title }}</title>
<meta name="description" content="{{ or .Description site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ or .Description site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="theme-color" content="#0b1530">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{- with resources.Get "styles.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">
{{- end }}
